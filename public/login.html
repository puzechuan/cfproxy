<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · GitHub 加速代理</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 18h12a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.6 8.2 4.9 4.9 0 0 0 6 18z"/>
        <path d="M12 9v6m0 0-2.5-2.5M12 15l2.5-2.5"/>
      </svg>
    </div>
    <div>
      <h1>GitHub 加速代理</h1>
      <div class="sub">本服务仅限注册用户使用</div>
    </div>
  </header>

  <section class="card auth-box" id="authCard" hidden>
    <h2 id="authTitle">登录后使用</h2>
    <div class="tabs">
      <button id="tabLogin" class="active">登录</button>
      <button id="tabRegister">注册</button>
    </div>
    <div class="auth-form">
      <div class="row-field">
        <label for="authUser">用户名</label>
        <input type="text" id="authUser" autocomplete="username" spellcheck="false" placeholder="3-32 位字母、数字、点、下划线或连字符">
      </div>
      <div class="row-field">
        <label for="authPass">密码</label>
        <input type="password" id="authPass" autocomplete="current-password" placeholder="至少 8 位">
      </div>
      <div class="row-field" id="inviteField" hidden>
        <label for="authInvite">管理员邀请码（仅配置的管理员用户名需要）</label>
        <input type="text" id="authInvite" spellcheck="false" placeholder="管理员邀请码">
      </div>
      <button id="authSubmit">登录</button>
      <p class="msg" id="authMsg"></p>
      <p class="auth-hint">还没有账号？切换到「注册」用用户名和密码即可创建。</p>
    </div>
  </section>

  <div class="loading" id="loading">正在检查登录状态…</div>

  <footer>Cloudflare Workers · GitHub Reverse Proxy · 请遵守 GitHub 服务条款，勿用于滥用流量</footer>
</div>

<script src="/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var mode = 'login';
  var next = CF.safeNext(new URLSearchParams(location.search).get('next'));

  function setMsg(text, isErr) {
    var el = $('authMsg');
    el.textContent = text;
    el.className = 'msg ' + (isErr ? 'err' : 'ok');
  }

  function setMode(m) {
    mode = m;
    var isLogin = m === 'login';
    $('tabLogin').classList.toggle('active', isLogin);
    $('tabRegister').classList.toggle('active', !isLogin);
    $('authTitle').textContent = isLogin ? '登录后使用' : '注册新账号';
    $('authSubmit').textContent = isLogin ? '登录' : '注册';
    $('authPass').autocomplete = isLogin ? 'current-password' : 'new-password';
    $('inviteField').hidden = isLogin;
    setMsg('', false);
  }

  function submit() {
    var username = $('authUser').value.trim();
    var password = $('authPass').value;
    if (!username || !password) return setMsg('请填写用户名和密码', true);
    var payload = { username: username, password: password };
    if (mode === 'register' && $('authInvite').value) payload.inviteCode = $('authInvite').value;

    var done = CF.busy($('authSubmit'), mode === 'login' ? '登录中…' : '注册中…');
    CF.api('/api/' + (mode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (out) {
      if (!out.ok) throw new Error(out.data.error || '操作失败');
      setMsg(mode === 'login' ? '登录成功' : '注册成功', false);
      location.replace(next);
    }).catch(function (e) {
      setMsg(e.message, true);
      done();
    });
  }

  $('tabLogin').addEventListener('click', function () { setMode('login'); });
  $('tabRegister').addEventListener('click', function () { setMode('register'); });
  $('authSubmit').addEventListener('click', submit);
  $('authPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  $('authUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('authPass').focus(); });

  // 已登录就不必再看登录页
  CF.me().then(function (user) {
    if (user) return location.replace(next);
    $('loading').hidden = true;
    $('authCard').hidden = false;
    $('authUser').focus();
  });
})();
</script>
</body>
</html>
